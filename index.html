<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lualaucher-andes - Luau Encryptor Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        code, textarea { font-family: 'JetBrains Mono', monospace; }
        textarea::-webkit-scrollbar { width: 6px; height: 6px; }
        textarea::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-indigo-500 font-bold text-xl">⚡ lualaucher-andes</span>
                <span class="text-xs bg-indigo-500/15 text-indigo-400 px-2.5 py-0.5 rounded border border-indigo-500/30">UTF-8 / XOR Engine</span>
            </div>
            <div class="text-xs text-emerald-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Ready to Deploy
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Input Panel -->
        <div class="flex flex-col bg-gray-900 border border-gray-800 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-semibold text-gray-300">Raw Luau Source</label>
                <select id="modeSelect" class="bg-gray-800 border border-gray-700 text-xs text-gray-200 rounded px-2.5 py-1.5 outline-none focus:border-indigo-500">
                    <option value="xor_embedded">🔒 XOR Self-Decrypting Loader (UTF-8 Safe)</option>
                    <option value="base64_http">Base64 HttpService Wrapper</option>
                    <option value="byte_char">string.char Native Loader</option>
                    <option value="minify">Minify & Strip Comments</option>
                </select>
            </div>
            <textarea id="inputCode" placeholder="Paste your Luau script here..." class="flex-1 w-full h-80 bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs text-gray-200 resize-none outline-none focus:border-indigo-500 leading-relaxed"></textarea>
            <div class="flex gap-2 mt-3">
                <button onclick="handleProcess()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-xs py-3 rounded-lg transition shadow-lg shadow-indigo-600/20">Process / Encrypt</button>
                <button onclick="clearAll()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-4 py-3 rounded-lg transition">Clear</button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="flex flex-col bg-gray-900 border border-gray-800 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-semibold text-gray-300">Protected / Encrypted Output</label>
                <button onclick="copyOutput()" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded transition">Copy Output</button>
            </div>
            <textarea id="outputCode" readonly placeholder="Output will appear here..." class="flex-1 w-full h-80 bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs text-emerald-400 resize-none outline-none leading-relaxed"></textarea>
            
            <!-- Quick Loadstring Builder for Raw URL -->
            <div class="mt-3 bg-gray-950 border border-gray-800 rounded-lg p-3">
                <div class="text-[11px] text-gray-400 mb-1.5">Tạo nhanh loadstring với Raw URL/Gist:</div>
                <div class="flex gap-2">
                    <input type="text" id="rawUrlInput" placeholder="https://your-raw-domain.com/script.txt" class="flex-1 bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 text-[11px] text-gray-200 outline-none focus:border-indigo-500" />
                    <button onclick="generateLoadstringFromUrl()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] px-3.5 py-1.5 rounded font-semibold transition">Gen Loadstring</button>
                </div>
                <div id="resultLoadstringBox" class="mt-2 hidden">
                    <div class="flex items-center gap-2">
                        <input type="text" id="loadstringResult" readonly class="flex-1 bg-gray-900 border border-gray-800 rounded px-2.5 py-1.5 text-[11px] text-emerald-300 outline-none select-all" />
                        <button onclick="copyLoadstringResult()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-[11px] px-3 py-1.5 rounded">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Chuẩn UTF-8 byte array helper (tránh lỗi font/dấu tiếng Việt)
        function getUtf8Bytes(str) {
            return Array.from(new TextEncoder().encode(str));
        }

        function utf8_to_b64(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function handleProcess() {
            const code = document.getElementById('inputCode').value;
            const mode = document.getElementById('modeSelect').value;
            if (!code.trim()) {
                alert('Vui lòng nhập code Luau trước!');
                return;
            }

            let output = '';
            if (mode === 'xor_embedded') {
                const key = Math.floor(Math.random() * 200) + 15; // Random key 15..214
                const utf8Bytes = getUtf8Bytes(code);
                const encryptedBytes = utf8Bytes.map(b => b ^ (key & 0xFF));
                
                // Gom chunk 2000 phần tử để tránh tràn dòng
                const byteChunks = [];
                const chunkSize = 2000;
                for (let i = 0; i < encryptedBytes.length; i += chunkSize) {
                    byteChunks.push(encryptedBytes.slice(i, i + chunkSize).join(','));
                }
                const tablesDef = byteChunks.map((chunk, idx) => `local _b${idx+1} = {${chunk}}`).join('\n');
                const concatTable = byteChunks.map((_, idx) => `table.move(_b${idx+1}, 1, #${_b${idx+1}}, #_c + 1, _c)`).join('\n');

                output = `-- [lualaucher-andes] XOR Self-Decrypting Loader
local _k = ${key}
local _c = {}
${tablesDef}
${concatTable}
local _char = string.char
local _x = bit32.bxor
local _t = {}
for _i = 1, #_c do
    _t[_i] = _char(_x(_c[_i], _k))
end
local _fn, _err = loadstring(table.concat(_t))
if _fn then
    _fn()
else
    warn("lualaucher-andes decrypt error: " .. tostring(_err))
end`;
            } else if (mode === 'base64_http') {
                const encoded = utf8_to_b64(code);
                output = `-- [lualaucher-andes] Base64 HttpService Wrapper
local _payload = "${encoded}"
local _decoded = game:GetService("HttpService"):Base64Decode(_payload)
local _fn, _err = loadstring(_decoded)
if _fn then _fn() else warn("lualaucher-andes error: " .. tostring(_err)) end`;
            } else if (mode === 'byte_char') {
                const bytes = getUtf8Bytes(code);
                const byteChunks = [];
                const chunkSize = 2000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    byteChunks.push(bytes.slice(i, i + chunkSize).join(','));
                }
                const strConcat = byteChunks.map(c => `string.char(${c})`).join(' .. ');
                output = `-- [lualaucher-andes] Native string.char Loader
local _fn, _err = loadstring(${strConcat})
if _fn then _fn() else warn("Error: " .. tostring(_err)) end`;
            } else {
                output = `-- [lualaucher-andes] Minified
` + code
                    .replace(/--\[\[[\s\S]*?\]\]/g, '')
                    .replace(/^[ \t]*--.*$/gm, '')
                    .replace(/\r\n/g, '\n')
                    .split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length > 0)
                    .join('\n');
            }

            document.getElementById('outputCode').value = output;
        }

        function copyOutput() {
            const text = document.getElementById('outputCode').value;
            if (!text) return alert('Chưa có code để copy!');
            navigator.clipboard.writeText(text);
            alert('Đã copy protected output!');
        }

        function generateLoadstringFromUrl() {
            const url = document.getElementById('rawUrlInput').value.trim();
            if (!url) return alert('Nhập URL raw/gist trước!');
            const loadstring = `loadstring(game:HttpGet("${url}"))()`;
            document.getElementById('resultLoadstringBox').classList.remove('hidden');
            document.getElementById('loadstringResult').value = loadstring;
        }

        function copyLoadstringResult() {
            const text = document.getElementById('loadstringResult').value;
            if (!text) return;
            navigator.clipboard.writeText(text);
            alert('Đã copy loadstring!');
        }

        function clearAll() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
            document.getElementById('resultLoadstringBox').classList.add('hidden');
            document.getElementById('rawUrlInput').value = '';
        }
    </script>
</body>
</html>
